[versions]
kotlin = "2.4.0"
logback = "1.5.35"
bcrypt = "0.10.2"
simpleJavaMail = "8.12.6"
flyway = "12.11.0"
mysqlConnector = "9.6.0"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
simpleJavaMail = { module = "org.simplejavamail:simple-java-mail", version.ref = "simpleJavaMail" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnector" }
